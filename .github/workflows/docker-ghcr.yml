name: Publish Docker image to GHCR

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Supersede an in-flight build when new commits land on the same ref.
# Tag builds are never cancelled.
concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # GHCR requires a lowercase image path, but github.repository_owner preserves
  # the account's original casing (e.g. "KaHooli"), so normalise it once here.
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - id: image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/libation-web" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            # Native arm64 runner. Emulating the .NET publish under QEMU takes
            # well over an hour, so this is worth it even though private-repo
            # arm64 runners get 2 vCPUs rather than the 4 public repos get.
            # Standard runner: draws on the plan's included Actions minutes.
            runner: ubuntu-24.04-arm
    env:
      REGISTRY_IMAGE: ${{ needs.prepare.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive platform slug
        id: platform
        run: echo "pair=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests build only. A PR from a fork gets a read-only GITHUB_TOKEN,
      # so pushing would fail; this still catches a broken Dockerfile.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY_IMAGE }}
          cache-from: type=gha,scope=${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.platform.outputs.pair }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=image,push-by-digest=true,name-canonical=true,push=true' }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Boot the amd64 image and assert the Audible sign-in URLs are well-formed.
  # This gates `merge`, so an image that fails never receives a usable tag.
  # Rebuilding here is cheap: the layers are already in the cache from `build`,
  # and `load: true` cannot be combined with the digest-push exporter.
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: libation-web:smoke
          cache-from: type=gha,scope=linux-amd64

      - name: Run smoke test
        run: ./scripts/smoke-test.sh libation-web:smoke

  # Exercise the Chaptarr integration against a stub Chaptarr server. This runs
  # on the source tree rather than the image — it needs nothing from the
  # container, and catches a broken payload before an image is ever tagged.
  chaptarr:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Chaptarr integration test
        run: PYTHONPATH=backend python scripts/test-chaptarr.py

  # Migrations, dual-backend support and credential encryption. Runs the whole
  # database section twice — once on SQLite, once against the PostgreSQL service
  # below — because dialect bugs only show up when something exercises Postgres.
  potation:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: potation
          POSTGRES_PASSWORD: potation
          POSTGRES_DB: potation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U potation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Potation foundation test
        env:
          POTATION_TEST_POSTGRES_URL: postgresql://potation:potation@127.0.0.1:5432/potation_test
        run: PYTHONPATH=backend python scripts/test-potation.py

  # Combine the two single-arch images into one multi-arch manifest and apply
  # the human-readable tags. Only this job creates tags; the build job pushes
  # untagged digests.
  merge:
    needs: [prepare, build, smoke, chaptarr, potation]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_IMAGE: ${{ needs.prepare.outputs.image }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          # Word splitting is intentional: both subshells expand to multiple
          # separate arguments (-t <tag> ... and one image ref per digest file).
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY_IMAGE}@sha256:%s " *)

      - name: Inspect published image
        run: docker buildx imagetools inspect "${REGISTRY_IMAGE}:${{ steps.meta.outputs.version }}"
