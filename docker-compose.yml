services:
  libation:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LIBATION_VERSION: "13.4.9"
    image: libation-web:latest
    container_name: libation
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./config:/config
      - libation-search:/config/SearchEngine
      - ./audiobooks:/audiobooks
    environment:
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
      - SECRET_KEY=change-me-use-a-long-random-string
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=60
      - PUID=1000
      - PGID=1000
      # Storage defaults to SQLite on the /data volume. To use PostgreSQL
      # instead, uncomment the `postgres` service below and this line:
      # - DATABASE_URL=postgresql://libation:libation@postgres:5432/libation
    restart: unless-stopped
    # depends_on:
    #   postgres:
    #     condition: service_healthy

  # Optional PostgreSQL backend. SQLite is the default and needs none of this.
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: libation-db
  #   environment:
  #     - POSTGRES_USER=libation
