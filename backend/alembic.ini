[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
version_path_separator = os

# The URL is supplied by env.py from settings.DATABASE_URL so there is exactly
# one source of truth for it, and so PostgreSQL aliases get normalised to
# psycopg 3 the same way the app does. Deliberately left blank here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
